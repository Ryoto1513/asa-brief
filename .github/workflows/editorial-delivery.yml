name: Chat mirror publication (main only)
on:
  push:
    branches: [main]
    paths:
      - 'config/chat-briefs/**'
      - 'config/editorial.json'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'tools/build_site.py'
      - 'tools/chat_brief.py'
      - 'tools/chat_brief_verify.py'
      - '.github/workflows/editorial-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
# Hold the same publication lock through hash and actual public-DOM verification.
concurrency:
  group: asa-brief-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Ryoto1513/asa-brief' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require a public repository for the no-additional-cost design
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "false"
      - name: Check out current main after acquiring publication lock
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Refuse an obsolete queued publication event
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and build the same confirmed manuscript
        run: python tools/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact (one-day retention)
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.site'
          retention-days: 1
      - name: Refuse an obsolete checkout before deployment
        run: |
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$remote"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Chat mirror files and hashes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$remote"
          python tools/chat_brief_verify.py --expected .site/data/chat-brief-manifest.json --base-url "$PAGE_URL" --status-output chat-brief-delivery-status.json
      - name: Report verification outcome (never a Chat delivery claim)
        if: always()
        run: |
          if test -f chat-brief-delivery-status.json; then
            cat chat-brief-delivery-status.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"state":"failed","publication_verified":false,"reason":"workflow_failed_or_unverified","conversation_delivery":"not_sent"}' >> "$GITHUB_STEP_SUMMARY"
          fi
  public-browser:
    name: Verify deployed Chat body in Chromium (read only)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require the deployed commit to remain current
        run: |
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$remote"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Same existing pinned test dependency as editorial-checks.yml; no new service.
      - name: Install existing browser test dependency
        run: python -m pip install playwright==1.62.0
      - name: Install existing Chromium test runtime
        run: python -m playwright install --with-deps chromium
      - name: Build expected canonical public content
        run: python tools/build_site.py
      - name: Compare actual public DOM and earnings with the approved source
        run: python tests/browser_chat_brief.py --public-url https://ryoto1513.github.io/asa-brief/
      - name: Retain only public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-brief-public-browser-evidence
          path: browser-artifacts/chat-brief/
          if-no-files-found: warn
          retention-days: 1
