name: Chat mirror and earnings checks (no deployment)
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline tests with synthetic manuscripts (no feed fetch)
        run: python -m unittest discover -s tests -v
      - name: Build public files without uploading or deploying
        run: python tools/build_site.py
      - name: Confirm canonical bodies are copied exactly
        run: |
          for source in config/chat-briefs/*.md; do
            cmp "$source" ".site/data/chat-briefs/$(basename "$source")"
          done
          test ! -e .site/data/latest.json
          test ! -e .site/data/archive
  browser:
    name: Chromium fixture smoke (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium and OS dependencies on the standard CI runner
        id: browsers
        run: python -m playwright install --with-deps chromium
      - name: Build canonical public fixture on this runner
        run: python tools/build_site.py
      - name: JavaScript date, renderer and earnings regression
        run: |
          node tests/test_briefing_dates.js
          node tests/test_readability_renderer.js
          node tests/test_earnings_calendar.js
      - name: Chat mirror preservation, privacy, mobile and interrupted-flow regression
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/browser_chat_brief.py
      - name: Retain only public and synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-browser-evidence
          path: browser-artifacts/chat-brief/
          if-no-files-found: warn
          retention-days: 1
