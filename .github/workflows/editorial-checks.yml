name: Editorial checks (no deployment)
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline tests with synthetic manuscripts (no feed fetch)
        run: python -m unittest discover -s tests -v
      - name: Build public files without uploading or deploying
        run: python tools/build_site.py
      - name: Confirm source manuscript is copied exactly
        run: cmp config/editorial.json .site/data/editorial.json
  browser:
    name: Chromium fixture smoke (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium and OS dependencies on the standard CI runner
        id: browsers
        run: python -m playwright install --with-deps chromium
      - name: Existing RSS, archive and simulated-offline UI smoke
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/browser_smoke.py
      - name: Existing three-article UI regression (in-memory fixtures)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/browser_v12.py
      - name: Synthetic fourth article and mixed RSS UI regression
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/browser_editorial.py --output-dir browser-artifacts/editorial
      - name: Retain only public and synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-browser-evidence
          path: |
            browser-artifacts/v12/asa_brief_v12_home.png
            browser-artifacts/v12/asa_brief_v12_article.png
            browser-artifacts/v12/asa_brief_v12_tables.png
            browser-artifacts/v12/asa_brief_v12_browser_report.json
            browser-artifacts/editorial/asa_brief_phase2_home.png
            browser-artifacts/editorial/asa_brief_phase2_numbers.png
            browser-artifacts/editorial/asa_brief_phase2_browser_report.json
          if-no-files-found: warn
          retention-days: 1
